spring:
  application:
    name: straight-street-go
  datasource:
    url: jdbc:h2:mem:straight-street-go;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  reservation:
    turnaround-buffer: PT1H
