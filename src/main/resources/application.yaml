server:
  port: ${PORT:8080}

spring:
  application:
    name: straight-street-go
  datasource:
    url: jdbc:h2:mem:straight-street-go;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://marekmaciejewski.github.io,http://localhost:5173,http://127.0.0.1:5173}
  reservation:
    turnaround-buffer: PT1H
