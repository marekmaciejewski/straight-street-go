databaseChangeLog:
  - changeSet:
      id: 260811-01-create-car
      author: Marek
      changes:
        - createTable:
            tableName: CAR
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: CAR_PK
              - column:
                  name: TYPE
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: FLEET_NUMBER
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: CAR
            columnNames: FLEET_NUMBER
            constraintName: CAR_FLEET_NUMBER_UK
        - sql:
            sql: ALTER TABLE CAR ADD CONSTRAINT CAR_TYPE_CHK CHECK (TYPE IN ('SEDAN', 'SUV', 'VAN'))
        - insert:
            tableName: CAR
            columns:
              - column:
                  name: ID
                  valueNumeric: 1
              - column:
                  name: TYPE
                  value: SEDAN
              - column:
                  name: FLEET_NUMBER
                  value: SEDAN-1
        - insert:
            tableName: CAR
            columns:
              - column:
                  name: ID
                  valueNumeric: 2
              - column:
                  name: TYPE
                  value: SEDAN
              - column:
                  name: FLEET_NUMBER
                  value: SEDAN-2
        - insert:
            tableName: CAR
            columns:
              - column:
                  name: ID
                  valueNumeric: 3
              - column:
                  name: TYPE
                  value: SUV
              - column:
                  name: FLEET_NUMBER
                  value: SUV-1
        - insert:
            tableName: CAR
            columns:
              - column:
                  name: ID
                  valueNumeric: 4
              - column:
                  name: TYPE
                  value: SUV
              - column:
                  name: FLEET_NUMBER
                  value: SUV-2
        - insert:
            tableName: CAR
            columns:
              - column:
                  name: ID
                  valueNumeric: 5
              - column:
                  name: TYPE
                  value: VAN
              - column:
                  name: FLEET_NUMBER
                  value: VAN-1

  - changeSet:
      id: 260811-02-create-reservation
      author: Marek
      changes:
        - createTable:
            tableName: RESERVATION
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: RESERVATION_PK
              - column:
                  name: CAR_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: CUSTOMER_ID
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: PICKUP_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: RETURN_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: RESERVED_UNTIL_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: NUMBER_OF_DAYS
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: RESERVATION
            baseColumnNames: CAR_ID
            referencedTableName: CAR
            referencedColumnNames: ID
            constraintName: RESERVATION_CAR_FK
        - sql:
            sql: ALTER TABLE RESERVATION ADD CONSTRAINT RESERVATION_DAYS_POSITIVE_CHK CHECK (NUMBER_OF_DAYS > 0)
        - sql:
            sql: ALTER TABLE RESERVATION ADD CONSTRAINT RESERVATION_RETURN_AFTER_PICKUP_CHK CHECK (RETURN_AT > PICKUP_AT)
        - sql:
            sql: ALTER TABLE RESERVATION ADD CONSTRAINT RESERVATION_RESERVED_AFTER_RETURN_CHK CHECK (RESERVED_UNTIL_AT > RETURN_AT)
        - createIndex:
            tableName: RESERVATION
            indexName: RESERVATION_CAR_INTERVAL_IDX
            columns:
              - column:
                  name: CAR_ID
              - column:
                  name: PICKUP_AT
              - column:
                  name: RESERVED_UNTIL_AT
