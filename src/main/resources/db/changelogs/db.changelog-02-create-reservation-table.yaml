databaseChangeLog:
  - changeSet:
      id: 260811-02-create-reservation
      author: Marek
      changes:
        - createTable:
            tableName: RESERVATION
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: RESERVATION_PK
              - column:
                  name: CAR_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: CUSTOMER_ID
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: PICKUP_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: RETURN_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: RESERVED_UNTIL_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: NUMBER_OF_DAYS
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: RESERVATION
            baseColumnNames: CAR_ID
            referencedTableName: CAR
            referencedColumnNames: ID
            constraintName: RESERVATION_CAR_FK
        - sql:
            sql: ALTER TABLE RESERVATION ADD CONSTRAINT RESERVATION_DAYS_POSITIVE_CHK CHECK (NUMBER_OF_DAYS > 0)
        - sql:
            sql: ALTER TABLE RESERVATION ADD CONSTRAINT RESERVATION_RETURN_AFTER_PICKUP_CHK CHECK (RETURN_AT > PICKUP_AT)
        - sql:
            sql: ALTER TABLE RESERVATION ADD CONSTRAINT RESERVATION_RESERVED_AFTER_RETURN_CHK CHECK (RESERVED_UNTIL_AT > RETURN_AT)
        - createIndex:
            tableName: RESERVATION
            indexName: RESERVATION_CAR_INTERVAL_IDX
            columns:
              - column:
                  name: CAR_ID
              - column:
                  name: PICKUP_AT
              - column:
                  name: RESERVED_UNTIL_AT
